# Aleph for Grimmory modification, 2026-11-28: the tests on every push and
# pull request, with LuaJIT (KOReader's Lua); the end-to-end run against a
# real Grimmory in Docker on demand (Actions > Tests > Run workflow).
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Also run against a real Grimmory (Docker, about 6 minutes)"
        type: boolean
        default: true
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit
      - name: Every Lua file compiles
        run: |
          find . -name '*.lua' -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            luajit -bl "$f" > /dev/null || { echo "does not compile: $f"; exit 1; }
          done
      - name: Tests
        run: for t in tests/*.lua; do echo "== $t"; luajit "$t"; done
  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit lua-socket lua-cjson zip
      - name: Against a real Grimmory
        run: tests/e2e/run.sh
